name: Hackathon Hunter IT - Daily Scan

on:
  schedule:
    - cron: '0 7 * * *'  # Every day at 07:00 UTC (08:00 CET / 09:00 CEST)
  workflow_dispatch:     # Manual trigger

permissions:
  contents: write        # To commit output files

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create config from secrets
        run: |
          cat > config.yaml << 'EOF'
          telegram_bot_token: "${{ secrets.TELEGRAM_BOT_TOKEN }}"
          telegram_chat_id: "${{ secrets.TELEGRAM_CHAT_ID }}"
          notion_token: "${{ secrets.NOTION_TOKEN }}"
          notion_db_id: "${{ secrets.NOTION_DB_ID }}"
          output_dir: "output"
          max_age_days: 90
          sources:
            devpost: true
            hackerrank: true
            eventbrite_it: true
            mii_istruzione: true
            regione_lombardia: true
            regione_emilia: true
            polimi_hack: true
            unibo_hack: true
            hackinbo: true
            owi_italy: true
            github_events: true
            oii_olimpiadi: true
          EOF

      - name: Run Hackathon Hunter
        run: |
          python hackathon_hunter.py --schedule

      - name: Commit and push output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff --staged --quiet || git commit -m "🏆 Daily hackathon scan: $(date +'%Y-%m-%d')"
          git push

      - name: Upload output as artifact
        uses: actions/upload-artifact@v4
        with:
          name: hackathon-report-${{ github.run_id }}
          path: output/
          retention-days: 30

  notify-summary:
    needs: hunt
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: hackathon-report-${{ github.run_id }}
          path: output/

      - name: Print summary
        run: |
          echo "## 🏆 Hackathon Hunter Summary"
          echo ""
          ls -la output/
          for f in output/*.md; do
            echo "### $(basename $f)"
            head -50 "$f"
            echo ""
          done