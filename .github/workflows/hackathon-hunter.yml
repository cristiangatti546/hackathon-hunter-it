name: Hackathon Hunter IT - Daily Scan
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Create config from secrets
        run: |
          cat > config.yaml << 'EOF'
          telegram_bot_token: "${{ secrets.TELEGRAM_BOT_TOKEN }}"
          telegram_chat_id: "${{ secrets.TELEGRAM_CHAT_ID }}"
          notion_token: "${{ secrets.NOTION_TOKEN }}"
          notion_db_id: "${{ secrets.NOTION_DB_ID }}"
          output_dir: "output"
          max_age_days: 90
          sources:
            devpost: true
            hackerrank: true
            eventbrite_it: true
            mii_istruzione: true
            regione_lombardia: true
            regione_emilia: true
            polimi_hack: true
            unibo_hack: true
            hackinbo: true
            owi_italy: true
            github_events: true
            oii_olimpiadi: true
          EOF
      - run: python hackathon_hunter.py --schedule
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff --staged --quiet || git commit -m "🏆 Daily hackathon scan: $(date +'%Y-%m-%d')"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: hackathon-report-${{ github.run_id }}
          path: output/
          retention-days: 30
